name: Image

# Build the Lambda container image and scan it on pull requests that change what goes into it.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - src/**
      - scripts/**
      - data/*.json

permissions:
  contents: read
  id-token: write # OIDC token for the ECR Public login below

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Base images come from public.ecr.aws: anonymous pulls from shared runners hit its data limit (429).
      # The role (terraform output github_pr_role_arn) can only get the ECR Public login token. Skipped for
      # forks, which get no OIDC token, and until the AWS_PR_ROLE_ARN variable exists.
      - if: vars.AWS_PR_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PR_ROLE_ARN }}
          aws-region: us-east-1 # ECR Public only issues tokens in us-east-1
      - if: vars.AWS_PR_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - uses: docker/setup-buildx-action@v3
      # Lambda only accepts a single-platform image manifest: no provenance attestations
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          load: true
          tags: connoisseur-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts on a read-only filesystem, like on Lambda
        run: |
          docker run -d --name api --read-only --tmpfs /tmp:rw,exec,size=1g -p 8080:8080 connoisseur-api:${{ github.sha }}
          for _ in $(seq 1 60); do curl -fsS localhost:8080/health && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Vulnerability scan (fail on fixable critical/high)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: connoisseur-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
