[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connoisseur-companion"
version = "0.2.0"
description = "Restaurant and recipe recommendations with local LLMs: multimodal RAG, a LangGraph multi-agent workflow with web search, and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "ollama>=0.6",
    "fastmcp>=3.1,<4",
    "mcp>=1.25,<2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langgraph>=1.0,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "structlog>=24.1",
    "chromadb>=1.0,<2",
    "fastembed>=0.5",
    "numpy>=1.26",
    "diskcache>=5.6",
]

[project.optional-dependencies]
# Local developer chat UI (mounted on the API at /ui)
ui = ["gradio>=6.0,<7"]
# Bedrock provider used on AWS
aws = ["langchain-aws>=1.0", "boto3>=1.35"]
# Notebooks: the original exploratory pipeline (torch-based embeddings, langchain-chroma)
notebooks = [
    "chromadb>=1.5",
    "sentence-transformers>=2.7",
    "transformers",
    "torch",
    "pillow",
    "matplotlib",
    "tenacity",
    "requests",
    "langchain>=1.0",
    "langchain-community>=0.3",
    "langchain-chroma>=0.2",
    "jupyter",
]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.17", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
connoisseur = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["index: needs the ONNX embedding models and a built vector index (slow, downloads models)"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
